const BUILTIN_VOICE_BASE_LABELS={
  'builtin-1':'Henri · 法国法语男声',
  'builtin-2':'Eloise · 法国法语女声',
  'builtin-3':'Denise · 法国法语女声',
  'builtin-cycle':'↻ 三种法国法语音色交替'

function applyBuiltinVoiceAvailability(slots){
  const ready=new Set(slots.map(Number).filter(n=>n>=1&&n<=3));
  const allReady=[1,2,3].every(n=>ready.has(n));
  for(const sel of [$('#voiceMode'),$('#mobileVoiceMode')]){
    if(!sel)continue;
    for(const opt of sel.options){
      const m=opt.value.match(/^builtin-(\d)$/);
      if(m){
        const n=Number(m[1]),ok=ready.has(n);
        opt.disabled=!ok;
        if(sel.id==='voiceMode'){const base=BUILTIN_VOICE_BASE_LABELS[opt.value]||opt.textContent.replace(/（需生成）/g,'').trim();opt.textContent=ok?base:`${base}（需生成）`;}
      }else if(opt.value==='builtin-cycle'){
        opt.disabled=!allReady;
        if(sel.id==='voiceMode'){const base=BUILTIN_VOICE_BASE_LABELS['builtin-cycle'];opt.textContent=allReady?base:`${base}（需生成完整三音色）`;}
      }
    }
  }
  const cur=$('#voiceMode').value,mm=cur.match(/^builtin-(\d)$/);
  if((mm&&!ready.has(Number(mm[1])))||(cur==='builtin-cycle'&&!allReady)){
    $('#voiceMode').value=ready.has(3)?'builtin-3':'system';
    $('#mobileVoiceMode').value=$('#voiceMode').value;
  }
  const hint=$('#builtinVoiceHint');
  if(hint){
    if(allReady)hint.textContent='3 个内置音色均为 fr-FR 单语神经音色：Henri / Eloise / Denise；避免多语种音色把短词误判成英语。';
    else hint.textContent='当前包只启用已验证的 Denise；运行 v5 音频生成脚本后会启用 Henri / Eloise / Denise 三个 fr-FR 单语音色。';
  }
}
async function loadBuiltinVoiceAvailability(){
  let slots=[3]; // 保守默认：旧项目中只有第 3 路 Denise 可以确认是法语单语音色。
  try{
    const r=await fetch('./audio/voice-manifest.json?v=fronly5',{cache:'no-store'});
    if(r.ok){
      const m=await r.json();
      if(Array.isArray(m.availableSlots))slots=m.availableSlots;
      else if(Array.isArray(m.voices))slots=m.voices.filter(v=>v.ready!==false).map(v=>v.slot);
    }
  }catch{}
  applyBuiltinVoiceAvailability(slots);
}
function builtinVoiceNumber(mode,turn=0){if(mode==='builtin-cycle')return (turn%3)+1;const m=String(mode).match(/^builtin-(\d)$/);return m?Number(m[1]):0;}
function builtinAsset(kind,id,voiceNo){if(kind==='sentence')return `audio/v${voiceNo}/sent/${String(id).padStart(4,'0')}.mp3?v=fronly5`;if(kind==='word'){const k=String(id).toLowerCase().replaceAll('’',"'");const n=BUILTIN_WORD_INDEX[k];if(n)return `audio/v${voiceNo}/word/${String(n).padStart(4,'0')}.mp3?v=fronly5`;}return '';}
function stopAudioOnly(){if(state.audio){try{state.audio.pause();state.audio.currentTime=0;}catch{}state.audio=null;}}
function speakSystem(text,lang,onend,voiceTurn=0){const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=Number($('#speed').value);if(lang.startsWith('fr')){const ps=voiceSettings();u.pitch=ps.pitch;u.volume=ps.volume;const mode=currentVoiceMode();const idx=mode==='system-cycle'&&state.voices.length?voiceTurn%state.voices.length:null;const v=selectedVoice(idx);if(v)u.voice=v;}else{const v=chineseVoice();if(v)u.voice=v;u.pitch=1;u.volume=1;}let done=false;const finish=()=>{if(done)return;done=true;onend&&onend();};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);}
function speakFrench(text,onend,asset,voiceTurn=0){const mode=currentVoiceMode(),vnum=builtinVoiceNumber(mode,voiceTurn);if(vnum&&asset){const src=builtinAsset(asset.kind,asset.id,vnum);if(src){const a=new Audio(src);state.audio=a;a.preload='auto';a.playbackRate=Number($('#speed').value);const finish=()=>{if(state.audio===a)state.audio=null;onend&&onend();};a.onended=finish;a.onerror=()=>{if(state.audio===a)state.audio=null;speakSystem(text,'fr-FR',onend,voiceTurn);};const p=a.play();if(p?.catch)p.catch(()=>{if(state.audio===a)state.audio=null;speakSystem(text,'fr-FR',onend,voiceTurn);});return;}}speakSystem(text,'fr-FR',onend,voiceTurn);}
function speakOnce(text,lang,onend,opts={}){if(lang.startsWith('fr'))return speakFrench(text,onend,opts.asset||null,opts.voiceTurn||0);speakSystem(text,lang,onend,0);}
function sequenceFor(s,done,my,voiceTurn=0){if(state.token!==my)return;const pattern=$('#playPattern').value,asset={kind:'sentence',id:s.id};if(pattern==='fr'){speakOnce(s.fr,'fr-FR',done,{asset,voiceTurn});return;}speakOnce(s.fr,'fr-FR',()=>{if(state.token!==my)return;setTimeout(()=>speakOnce(s.zh,'zh-CN',()=>{if(state.token!==my)return;setTimeout(()=>speakOnce(s.fr,'fr-FR',done,{asset,voiceTurn}),220);}),220);},{asset,voiceTurn});}
function stopAll(silent=false){state.token++;state.mode=null;state.currentId=null;state.range=null;stopAudioOnly();speechSynthesis.cancel();document.querySelectorAll('.sentence.playing').forEach(x=>x.classList.remove('playing'));if(!silent)setStatus('已停止。');}
function markPlaying(id){state.currentId=id;document.querySelectorAll('.sentence').forEach(x=>x.classList.toggle('playing',Number(x.dataset.id)===id));const s=SENTENCES[id-1];if(s&&'mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:s.fr,artist:`日常法语 2000 句 · #${id}`,album:s.zh});}catch{}}}
function startSentenceLoop(id){stopAll(true);const s=SENTENCES[id-1];if(!s)return;state.mode='sentence';const my=++state.token;markPlaying(id);markStudied(id);const val=$('#singleRepeat').value,limit=val==='inf'?Infinity:Number(val);let count=0;setStatus(`单句 ${limit===Infinity?'无限循环':`播放 ${limit} 次`} #${id}：${s.fr}`);const cycle=()=>{if(state.mode!=='sentence'||my!==state.token)return;sequenceFor(s,()=>{if(state.mode!=='sentence'||my!==state.token)return;count++;if(count>=limit){state.mode=null;document.querySelectorAll('.sentence.playing').forEach(x=>x.classList.remove('playing'));setStatus(`已完成 #${id}，共播放 ${count} 次。`);return;}setTimeout(cycle,Number($('#gap').value));},my,count);};cycle();}
function displayDictionaryGroups(info){const lexical=[],usage=[];for(const g of info.groups||[]){if(DICT_USAGE_POS.has(g.pos)){for(const m of g.meanings||[])if(!usage.includes(m))usage.push(m);}else lexical.push(g);}const blocks=lexical.map(g=>`<div class="meaningGroup"><span class="pos">${escapeHtml(g.pos)}</span><ul>${(g.meanings||[]).map(m=>`<li>${escapeHtml(m)}</li>`).join('')}</ul></div>`);if(usage.length)blocks.push(`<div class="meaningGroup"><span class="pos">例句用法</span><ul>${usage.map(m=>`<li>${escapeHtml(m)}</li>`).join('')}</ul></div>`);return blocks.join('');}
function showDictionary(raw,sentenceId=null){const key=normWord(raw),info=getDictionaryInfo(key);$('#dictWord').textContent=raw;$('#dictIPA').textContent=info.ipa?`/${info.ipa}/`:'';const lemma=inferLemma(raw,info),lemmaEl=$('#dictLemma');if(lemma&&normWord(lemma)!==key){lemmaEl.innerHTML=`动词原形：<button class="lemmaBtn" type="button">${escapeHtml(lemma)}</button>`;lemmaEl.querySelector('.lemmaBtn').onclick=e=>{e.stopPropagation();startWordLoop(lemma,sentenceId);};}else{lemmaEl.textContent='';}const ctx=$('#dictContext'),sent=sentenceId?SENTENCES[sentenceId-1]:null;if(sent){ctx.innerHTML=`<div class="dictContextLabel">本句 #${sent.id}</div><div class="dictContextFr">${escapeHtml(sent.fr)}</div><div class="dictContextZh">${escapeHtml(sent.zh)}</div>`;ctx.classList.add('show');}else{ctx.innerHTML='';ctx.classList.remove('show');}$('#dictMeanings').innerHTML=displayDictionaryGroups(info);$('#dictionary').classList.add('show');return info;}
function startWordLoop(raw,sentenceId=null){stopAll(true);showDictionary(raw,sentenceId);state.mode='word';const my=++state.token;let turn=0;setStatus(`单词循环：${raw}`);const cycle=()=>{if(state.mode!=='word'||my!==state.token)return;const thisTurn=turn++;speakOnce(raw,'fr-FR',()=>setTimeout(cycle,Number($('#gap').value)),{asset:{kind:'word',id:String(raw).toLowerCase().replaceAll('’',"'")},voiceTurn:thisTurn});};cycle();}
function startRange(){let a=Math.max(1,Math.min(2000,Number($('#rangeStart').value)||1)),b=Math.max(1,Math.min(2000,Number($('#rangeEnd').value)||1));if(a>b)[a,b]=[b,a];$('#rangeStart').value=a;$('#rangeEnd').value=b;stopAll(true);state.mode='range';state.range={a,b,i:a};const my=++state.token,repeat=Math.max(1,Number($('#rangeRepeat').value)||1);setStatus(`区间循环：#${a}–#${b} · 每句 ${repeat} 次`);const nextSentence=()=>{if(state.mode!=='range'||my!==state.token)return;const id=state.range.i,s=SENTENCES[id-1];markPlaying(id);markStudied(id);let n=0;const repeatOne=()=>{if(state.mode!=='range'||my!==state.token)return;setStatus(`区间 #${a}–#${b} · #${id} · 第 ${n+1}/${repeat} 次`);sequenceFor(s,()=>{if(state.mode!=='range'||my!==state.token)return;n++;if(n<repeat){setTimeout(repeatOne,Number($('#gap').value));}else{state.range.i=id>=b?a:id+1;setTimeout(nextSentence,Number($('#gap').value));}},my,n);};repeatOne();};nextSentence();}
function jumpRelative(delta){let id=state.currentId;if(!id){const arr=filteredSentences();id=arr.length?arr[0].id:(state.cat*100+1);}const next=Math.max(1,Math.min(2000,id+delta));startSentenceLoop(next);ensureSentenceVisible(next);}
function ensureSentenceVisible(id){const s=SENTENCES[id-1];if(!s)return;if(!state.search){state.cat=s.category;state.page=Math.floor((id-1-state.cat*100)/state.pageSize)+1;render();}requestAnimationFrame(()=>document.querySelector(`.sentence[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}));}

function loadVoices(){const all=speechSynthesis.getVoices();state.allVoices=all;const fr=all.filter(v=>/^fr([_-]|$)/i.test(v.lang));state.voices=fr;const sel=$('#voiceSelect');if(!fr.length){sel.innerHTML='<option value="0">未检测到法语系统音色（按 fr-FR 自动选择）</option>';return;}sel.innerHTML=fr.map((v,i)=>`<option value="${i}">${escapeHtml(v.name)} · ${escapeHtml(v.lang)}${v.default?' · 默认':''}</option>`).join('');const uri=saved.voiceURI;if(uri){const idx=fr.findIndex(v=>v.voiceURI===uri);if(idx>=0)sel.value=String(idx);}}
function initSavedSettings(){if(saved.speed)$('#speed').value=saved.speed;if(saved.gap)$('#gap').value=saved.gap;if(saved.singleRepeat)$('#singleRepeat').value=saved.singleRepeat;if(saved.rangeRepeat)$('#rangeRepeat').value=saved.rangeRepeat;if(saved.playPattern)$('#playPattern').value=saved.playPattern;if(saved.profile)$('#profileSelect').value=saved.profile;if(saved.voiceMode)$('#voiceMode').value=saved.voiceMode;if(saved.highlight===false)$('#highlightToggle').checked=false;if(saved.filter)state.filter=saved.filter;$('#filterSelect').value=state.filter;$('#speedValue').textContent=Number($('#speed').value).toFixed(1)+'×';$('#mobileSingleRepeat').value=$('#singleRepeat').value;$('#mobileVoiceMode').value=$('#voiceMode').value;document.body.classList.toggle('pos-on',$('#highlightToggle').checked);}
function initTheme(){const old=localStorage.getItem('fr2000-theme'),theme=old||saved.theme||'light';document.documentElement.dataset.theme=theme;updateThemeMeta();$('#themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('fr2000-theme',next);updateThemeMeta();};}
function updateThemeMeta(){$('#themeColorMeta').setAttribute('content',document.documentElement.dataset.theme==='dark'?'#111111':'#f7f7f7');}


function setupMobileSettings(){const b=$('#mobileSettingsBtn');if(!b)return;const sync=()=>{const open=document.body.classList.contains('mobile-settings-open');b.setAttribute('aria-expanded',open?'true':'false');b.innerHTML=open?'⚙ 收起播放设置 <span aria-hidden="true">⌃</span>':'⚙ 播放设置 <span aria-hidden="true">⌄</span>';};b.onclick=()=>{document.body.classList.toggle('mobile-settings-open');sync();};sync();}
function setupSearch(){let timer;$('#searchInput').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.search=e.target.value.trim();state.page=1;render();},120);};$('#clearSearch').onclick=()=>{$('#searchInput').value='';state.search='';state.page=1;render();};$('#filterSelect').onchange=e=>{state.filter=e.target.value;state.page=1;saveAll();render();};}
function setupHighlight(){$('#highlightToggle').onchange=e=>{document.body.classList.toggle('pos-on',e.target.checked);saveAll();};}
function setupSwipe(){let sx=0,sy=0,st=0;const el=$('#sentenceList');el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});el.addEventListener('touchend',e=>{if(!e.changedTouches.length||Date.now()-st>800)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25){jumpRelative(dx<0?1:-1);}},{passive:true});}
function setupKeys(){document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;if(e.key==='ArrowLeft'){e.preventDefault();jumpRelative(-1);}else if(e.key==='ArrowRight'){e.preventDefault();jumpRelative(1);}else if(e.code==='MediaTrackPrevious'){jumpRelative(-1);}else if(e.code==='MediaTrackNext'){jumpRelative(1);}});}
function setupMediaSession(){if(!('mediaSession' in navigator))return;for(const [action,fn] of [['previoustrack',()=>jumpRelative(-1)],['nexttrack',()=>jumpRelative(1)],['stop',()=>stopAll()]]){try{navigator.mediaSession.setActionHandler(action,fn);}catch{}}}

function showInstallModal(title,html){$('#installTitle').textContent=title;$('#installBody').innerHTML=html;$('#installModal').classList.add('show');}
function setupInstall(){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.deferredInstall=e;});$('#installBtn').onclick=async()=>{if(state.deferredInstall){state.deferredInstall.prompt();try{await state.deferredInstall.userChoice;}catch{}state.deferredInstall=null;return;}const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(standalone){showInstallModal('已经是主屏幕应用','<p>当前已以独立 App 模式运行，无需重复安装。</p>');return;}if(location.protocol==='file:'){showInstallModal('iPhone / PWA 安装说明','<p>当前是本地 HTML 文件。它可以直接使用，但 <strong>PWA 离线安装需要通过 HTTPS 网站打开</strong>，Service Worker 在 file:// 下不会启用。</p><p>请把整个 PWA 文件夹部署到 HTTPS 网站，再用 Safari 打开。</p>');return;}if(isiOS){showInstallModal('在 iPhone 上安装','<p>在 Safari 中点底部/顶部的 <strong>分享</strong> 按钮 → 选择 <strong>“添加到主屏幕”</strong> → 点“添加”。</p><p>安装后会以独立 App 方式打开，页面资源会缓存供离线使用。</p>');}else{showInstallModal('安装到设备','<p>如果浏览器没有弹出安装提示，请打开浏览器菜单，选择“安装应用”或“添加到主屏幕”。</p>');}};$('#installClose').onclick=()=>$('#installModal').classList.remove('show');$('#installModal').onclick=e=>{if(e.target===$('#installModal'))$('#installModal').classList.remove('show');};if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{});}}

$('#speed').oninput=e=>{$('#speedValue').textContent=Number(e.target.value).toFixed(1)+'×';saveAll();};for(const id of ['gap','singleRepeat','rangeRepeat','playPattern','profileSelect','voiceSelect','voiceMode']){$('#'+id).addEventListener('change',saveAll);}$('#singleRepeat').addEventListener('change',()=>{$('#mobileSingleRepeat').value=$('#singleRepeat').value;});$('#mobileSingleRepeat').addEventListener('change',e=>{$('#singleRepeat').value=e.target.value;saveAll();});$('#voiceMode').addEventListener('change',()=>{$('#mobileVoiceMode').value=$('#voiceMode').value;});$('#mobileVoiceMode').addEventListener('change',e=>{$('#voiceMode').value=e.target.value;saveAll();});$('#stopBtn').onclick=()=>stopAll();$('#rangeBtn').onclick=startRange;$('#prevBtn').onclick=()=>jumpRelative(-1);$('#nextBtn').onclick=()=>jumpRelative(1);$('#mPrev').onclick=()=>jumpRelative(-1);$('#mNext').onclick=()=>jumpRelative(1);$('#mStop').onclick=()=>stopAll();$('#dictClose').onclick=()=>$('#dictionary').classList.remove('show');
